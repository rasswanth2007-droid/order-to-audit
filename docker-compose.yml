services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: o2a
      POSTGRES_PASSWORD: ${DB_PASSWORD:-o2a_dev_password}
      POSTGRES_DB: o2a
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U o2a"]
      interval: 5s
      retries: 10
  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql+psycopg2://o2a:${DB_PASSWORD:-o2a_dev_password}@db:5432/o2a
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-do-not-use-in-production-0123456789}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-Demo@12345}
    ports: ["8000:8000"]
volumes:
  pgdata:
